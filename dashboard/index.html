<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sessioni attive</title>
<link rel="stylesheet" href="stile.css">
</head>
<body>
<main>
<header class="testa">
  <div>
    <h1>Sessioni attive <span id="demo" class="demo" hidden>dati finti</span></h1>
    <div class="sub" id="gen">caricamento…</div>
  </div>
  <div class="azioni-testa">
    <button id="tema" title="Tema chiaro, scuro o automatico">◐ automatico</button>
    <button id="agg">Aggiorna</button>
  </div>
</header>

<nav class="schede" id="schede" aria-label="Viste"></nav>

<div class="barra" id="filtri">
  <input type="search" id="testo" placeholder="Cerca titolo, progetto, nota, etichetta…" aria-label="Cerca">
  <select id="macchina" aria-label="Macchina"><option value="">tutte le macchine</option></select>
  <select id="gruppo" aria-label="Gruppo"><option value="">tutti i gruppi</option></select>
  <label><input type="checkbox" id="interne"> revisioni guardian</label>
  <label><input type="checkbox" id="ferme" checked> sessioni ferme</label>
  <label><input type="checkbox" id="nascoste"> nascoste</label>
</div>

<div id="vista" class="vista"></div>

<details class="fonti-box">
  <summary>Fonti dei dati</summary>
  <div class="fonti" id="fonti"></div>
  <div class="manuali" id="manuali"></div>
</details>
</main>

<aside id="dettaglio" class="dettaglio" hidden aria-label="Dettaglio sessione"></aside>
<div id="messaggio" class="messaggio" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
